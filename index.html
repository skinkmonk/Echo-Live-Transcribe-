<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Echo Live Transcribe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1a1a3a 100%);
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .container {
      max-width: 700px;
      width: 100%;
      padding: 2rem 1.5rem;
    }
    header {
      margin-bottom: 2rem;
      text-align: center;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 2.5rem;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p.note {
      margin: 0;
      font-size: 0.95rem;
      color: #9ca3af;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    button {
      border: none;
      border-radius: 0.5rem;
      padding: 0.8rem 1.2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: #1f2937;
      color: #e5e7eb;
      transition: all 0.2s ease;
      border: 1px solid #374151;
    }
    button:hover:not(:disabled) {
      background: #2d3748;
      border-color: #4b5563;
      transform: translateY(-2px);
    }
    button.primary {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-color: #16a34a;
      color: #fff;
      font-size: 1.1rem;
      grid-column: span 2;
    }
    button.primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #16a34a, #15803d);
    }
    button.danger {
      background: #dc2626;
      border-color: #991b1b;
      color: #fff;
    }
    button.danger:hover:not(:disabled) {
      background: #b91c1c;
    }
    button.secondary {
      background: #374151;
      border-color: #4b5563;
    }
    button.success {
      background: #059669;
      border-color: #047857;
      color: #fff;
    }
    button.success:hover:not(:disabled) {
      background: #047857;
    }
    button:active:not(:disabled) {
      transform: scale(0.98);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status {
      padding: 1rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      background: #1f2937;
      border-left: 4px solid #2563eb;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      min-height: 50px;
    }
    .status.listening {
      border-left-color: #22c55e;
      background: #064e3b;
    }
    .status.error {
      border-left-color: #dc2626;
      background: #7f1d1d;
    }
    .status-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2563eb;
      animation: pulse 1.5s infinite;
      flex-shrink: 0;
    }
    .status.listening .status-indicator {
      background: #22c55e;
    }
    .status.error .status-indicator {
      background: #dc2626;
      animation: none;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .transcript-section {
      margin-bottom: 1.5rem;
    }
    .transcript-wrapper {
      border-radius: 0.5rem;
      background: #020617;
      border: 2px solid #2563eb;
      padding: 1rem;
      display: flex;
      flex-direction: column;
    }
    textarea {
      width: 100%;
      border: none;
      outline: none;
      resize: vertical;
      min-height: 200px;
      background: transparent;
      color: #e5e7eb;
      font-size: 1.1rem;
      line-height: 1.8;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    textarea::placeholder {
      color: #4b5563;
    }
    textarea:focus {
      outline: 1px solid #60a5fa;
    }
    .export-section {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 0.5rem;
      padding: 1.5rem;
      text-align: center;
    }
    .export-title {
      font-weight: 600;
      margin-bottom: 1rem;
      color: #d1d5db;
      font-size: 1rem;
    }
    .export-controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 0.5rem;
    }
    .export-btn {
      padding: 0.6rem 1rem;
      font-size: 0.9rem;
    }
    .footer-note {
      margin-top: 2rem;
      font-size: 0.9rem;
      color: #9ca3af;
      padding: 1rem;
      background: #1f2937;
      border-radius: 0.5rem;
      border-left: 3px solid #2563eb;
      text-align: center;
    }
    @media (max-width: 600px) {
      h1 {
        font-size: 1.8rem;
      }
      .container {
        padding: 1rem;
      }
      button.primary {
        grid-column: span 1;
      }
      textarea {
        font-size: 1rem;
        min-height: 150px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎙️ Echo Live Transcribe</h1>
      <p class="note">Speak clearly into your microphone. Real-time transcription.</p>
    </header>

    <div class="controls">
      <button id="startBtn" class="primary">🎤 START LISTENING</button>
      <button id="stopBtn" class="danger" disabled>⏹️ STOP</button>
      <button id="copyBtn" class="secondary">📋 Copy</button>
      <button id="clearBtn" class="secondary">🗑️ Clear</button>
    </div>

    <div class="status" id="status">
      <span class="status-indicator"></span>
      <span id="statusText">Click "START LISTENING" to begin</span>
    </div>

    <div class="transcript-section">
      <div class="transcript-wrapper">
        <textarea id="transcript" placeholder="Your transcript will appear here..." spellcheck="false"></textarea>
      </div>
    </div>

    <div class="export-section">
      <div class="export-title">💾 Save Your Transcript</div>
      <div class="export-controls">
        <button id="exportTxtBtn" class="success export-btn">TXT</button>
        <button id="exportJsonBtn" class="success export-btn">JSON</button>
        <button id="exportCsvBtn" class="success export-btn">CSV</button>
      </div>
    </div>

    <div class="footer-note">
      💡 Speak clearly. Press STOP when done speaking.
    </div>
  </div>

  <script>
    // ===== DOM ELEMENTS =====
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');
    
    const statusEl = document.getElementById('status');
    const statusText = document.getElementById('statusText');
    const transcriptEl = document.getElementById('transcript');
    
    const exportTxtBtn = document.getElementById('exportTxtBtn');
    const exportJsonBtn = document.getElementById('exportJsonBtn');
    const exportCsvBtn = document.getElementById('exportCsvBtn');

    // ===== STATE =====
    let recognition = null;
    let listening = false;
    let finalTranscript = '';

    // ===== STATUS UPDATES =====
    function updateStatus(message, type = 'idle') {
      statusText.textContent = message;
      statusEl.className = 'status ' + type;
    }

    // ===== SPEECH RECOGNITION SETUP =====
    function initRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      
      if (!SpeechRecognition) {
        updateStatus('❌ Not supported - Use Google Chrome', 'error');
        startBtn.disabled = true;
        return false;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        listening = true;
        startBtn.disabled = true;
        stopBtn.disabled = false;
        updateStatus('🎤 Listening... Speak now', 'listening');
      };

      recognition.onend = () => {
        listening = false;
        stopBtn.disabled = true;
        startBtn.disabled = false;
        updateStatus('⏹️ Stopped', 'idle');
      };

      recognition.onerror = (event) => {
        let msg = '❌ Error: ' + (event.error || 'unknown');
        
        if (event.error === 'not-allowed') {
          msg = '❌ Microphone denied - Check browser permissions';
        } else if (event.error === 'network') {
          msg = '❌ Network error - Try again';
        } else if (event.error === 'no-speech') {
          msg = '⚠️ No speech detected - Speak louder';
        }
        
        updateStatus(msg, 'error');
      };

      recognition.onresult = (event) => {
        let transcript = '';

        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript + ' ';
        }

        finalTranscript += transcript;
        transcriptEl.value = finalTranscript.trim();
      };

      return true;
    }

    // ===== EVENT LISTENERS =====
    startBtn.addEventListener('click', () => {
      if (!recognition) {
        if (!initRecognition()) return;
      }
      try {
        recognition.start();
      } catch (e) {
        console.log('Recognition already starting');
      }
    });

    stopBtn.addEventListener('click', () => {
      if (recognition) {
        recognition.stop();
      }
    });

    copyBtn.addEventListener('click', async () => {
      const text = transcriptEl.value.trim();
      
      if (!text) {
        updateStatus('⚠️ Nothing to copy', 'idle');
        return;
      }
      
      try {
        await navigator.clipboard.writeText(text);
        updateStatus('✅ Copied to clipboard', 'idle');
        setTimeout(() => updateStatus('Ready to transcribe', 'idle'), 2000);
      } catch (e) {
        updateStatus('❌ Copy failed', 'error');
      }
    });

    clearBtn.addEventListener('click', () => {
      if (confirm('Clear transcript?')) {
        finalTranscript = '';
        transcriptEl.value = '';
        updateStatus('✅ Cleared', 'idle');
      }
    });

    // ===== EXPORT FUNCTIONS =====
    function generateTimestamp() {
      return new Date().toISOString().replace(/[:.]/g, '-').slice(0, -5);
    }

    function downloadFile(content, filename, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      updateStatus('✅ Downloaded', 'idle');
      setTimeout(() => updateStatus('Ready to transcribe', 'idle'), 2000);
    }

    exportTxtBtn.addEventListener('click', () => {
      const text = transcriptEl.value;
      
      if (!text) {
        updateStatus('⚠️ Nothing to export', 'idle');
        return;
      }
      
      const content = `ECHO LIVE TRANSCRIBE
Generated: ${new Date().toLocaleString()}

${text}
`;
      
      downloadFile(content, `transcript-${generateTimestamp()}.txt`, 'text/plain');
    });

    exportJsonBtn.addEventListener('click', () => {
      const text = transcriptEl.value;
      
      if (!text) {
        updateStatus('⚠️ Nothing to export', 'idle');
        return;
      }
      
      const data = {
        generated: new Date().toISOString(),
        transcript: text,
        wordCount: text.split(/\s+/).filter(w => w).length,
        characterCount: text.length
      };
      
      const content = JSON.stringify(data, null, 2);
      downloadFile(content, `transcript-${generateTimestamp()}.json`, 'application/json');
    });

    exportCsvBtn.addEventListener('click', () => {
      const text = transcriptEl.value;
      
      if (!text) {
        updateStatus('⚠️ Nothing to export', 'idle');
        return;
      }
      
      const words = text.split(/\s+/).filter(w => w);
      let csv = 'Word Number,Word\n';
      
      words.forEach((word, index) => {
        csv += `${index + 1},"${word}"\n`;
      });
      
      downloadFile(csv, `transcript-${generateTimestamp()}.csv`, 'text/csv');
    });

    // ===== INITIALIZATION =====
    updateStatus('Ready to transcribe', 'idle');
  </script>
</body>
</html>
