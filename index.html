<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Echo Live Transcribe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1a1a3a 100%);
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .container {
      max-width: 700px;
      width: 100%;
      padding: 2rem 1.5rem;
    }
    header {
      margin-bottom: 2rem;
      text-align: center;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 2.5rem;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p.note {
      margin: 0;
      font-size: 0.95rem;
      color: #9ca3af;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    button {
      border: none;
      border-radius: 0.5rem;
      padding: 0.8rem 1.2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: #1f2937;
      color: #e5e7eb;
      transition: all 0.2s ease;
      border: 1px solid #374151;
    }
    button:hover:not(:disabled) {
      background: #2d3748;
      border-color: #4b5563;
      transform: translateY(-2px);
    }
    button.primary {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-color: #16a34a;
      color: #fff;
      font-size: 1.1rem;
      grid-column: span 2;
    }
    button.primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #16a34a, #15803d);
    }
    button.danger {
      background: #dc2626;
      border-color: #991b1b;
      color: #fff;
    }
    button.danger:hover:not(:disabled) {
      background: #b91c1c;
    }
    button.secondary {
      background: #374151;
      border-color: #4b5563;
    }
    button.success {
      background: #059669;
      border-color: #047857;
      color: #fff;
    }
    button.success:hover:not(:disabled) {
      background: #047857;
    }
    button:active:not(:disabled) {
      transform: scale(0.98);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status {
      padding: 1rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      background: #1f2937;
      border-left: 4px solid #2563eb;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      min-height: 50px;
    }
    .status.listening {
      border-left-color: #22c55e;
      background: #064e3b;
    }
    .status.error {
      border-left-color: #dc2626;
      background: #7f1d1d;
    }
    .status-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2563eb;
      animation: pulse 1.5s infinite;
      flex-shrink: 0;
    }
    .status.listening .status-indicator {
      background: #22c55e;
    }
    .status.error .status-indicator {
      background: #dc2626;
      animation: none;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .transcript-section {
      margin-bottom: 1.5rem;
    }
    .transcript-wrapper {
      border-radius: 0.5rem;
      background: #020617;
      border: 2px solid #2563eb;
      padding: 1rem;
      display: flex;
      flex-direction: column;
    }
    textarea {
      width: 100%;
      border: none;
      outline: none;
      resize: vertical;
      min-height: 200px;
      background: transparent;
      color: #e5e7eb;
      font-size: 1.1rem;
      line-height: 1.8;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    textarea::placeholder {
      color: #4b5563;
    }
    textarea:focus {
      outline: 1px solid #60a5fa;
    }
    .export-section {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 0.5rem;
      padding: 1.5rem;
      text-align: center;
    }
    .export-title {
      font-weight: 600;
      margin-bottom: 1rem;
      color: #d1d5db;
      font-size: 1rem;
    }
    .export-controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 0.5rem;
    }
    .export-btn {
      padding: 0.6rem 1rem;
      font-size: 0.9rem;
    }
    .footer-note {
      margin-top: 2rem;
      font-size: 0.9rem;
      color: #9ca3af;
      padding: 1rem;
      background: #1f2937;
      border-radius: 0.5rem;
      border-left: 3px solid #2563eb;
      text-align: center;
    }
    @media (max-width: 600px) {
      h1 {
        font-size: 1.8rem;
      }
      .container {
        padding: 1rem;
      }
      button.primary {
        grid-column: span 1;
      }
      textarea {
        font-size: 1rem;
        min-height: 150px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎙️ Echo Live Transcribe</h1>
      <p class="note">100% Phonetic transcription - captures exactly how you speak.</p>
    </header>

    <div class="controls">
      <button id="startBtn" class="primary">🎤 START LISTENING</button>
      <button id="stopBtn" class="danger" disabled>⏹️ STOP</button>
      <button id="copyBtn" class="secondary">📋 Copy</button>
      <button id="clearBtn" class="secondary">🗑️ Clear</button>
    </div>

    <div class="status" id="status">
      <span class="status-indicator"></span>
      <span id="statusText">Click "START LISTENING" to begin</span>
    </div>

    <div class="transcript-section">
      <div class="transcript-wrapper">
        <textarea id="transcript" placeholder="Your phonetic transcript will appear here..." spellcheck="false"></textarea>
      </div>
    </div>

    <div class="export-section">
      <div class="export-title">💾 Save Your Transcript</div>
      <div class="export-controls">
        <button id="exportTxtBtn" class="success export-btn">TXT</button>
        <button id="exportJsonBtn" class="success export-btn">JSON</button>
        <button id="exportCsvBtn" class="success export-btn">CSV</button>
      </div>
    </div>

    <div class="footer-note">
      💡 Phonetic conversion: exactly what you say, not what the words should be.
    </div>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');
    
    const statusEl = document.getElementById('status');
    const statusText = document.getElementById('statusText');
    const transcriptEl = document.getElementById('transcript');
    
    const exportTxtBtn = document.getElementById('exportTxtBtn');
    const exportJsonBtn = document.getElementById('exportJsonBtn');
    const exportCsvBtn = document.getElementById('exportCsvBtn');

    let recognition = null;
    let isRecording = false;
    let finalTranscript = '';
    let lastResultIndex = -1;

    function updateStatus(message, type = 'idle') {
      statusText.textContent = message;
      statusEl.className = 'status ' + type;
    }

    // Advanced phonetic converter
    function toPhonetic(text) {
      if (!text) return '';
      
      let result = text.toLowerCase();
      
      // Remove punctuation but keep spacing
      result = result.replace(/[.,!?;:\-'"]/g, '');
      
      // Complex phonetic mappings - more detailed
      const phoneticsMap = [
        // Multi-char patterns first (before single chars)
        [/th(?=\w)/g, 'θ'],
        [/(?<=\w)th/g, 'θ'],
        [/sh/g, 'ʃ'],
        [/ch/g, 'tʃ'],
        [/ng/g, 'ŋ'],
        [/ck/g, 'k'],
        [/ph/g, 'f'],
        [/gh/g, ''],  // silent in many words
        [/wr/g, 'r'],  // silent w
        [/kn/g, 'n'],  // silent k
        [/wh/g, 'w'],
        [/qu/g, 'kw'],
        [/x/g, 'ks'],
        [/z/g, 'z'],
        [/s(?=[aeiou])/g, 'z'],  // s before vowel sometimes sounds like z
        [/c(?=[ei])/g, 's'],  // c before e,i sounds like s
        [/j/g, 'dʒ'],
        [/y(?=[aeiou])/g, 'j'],  // y before vowel
        
        // Vowel sounds (context-aware)
        [/ea/g, 'iː'],  // beat, seat
        [/ee/g, 'iː'],  // flee, tree
        [/ie/g, 'iː'],  // brief
        [/oa/g, 'oʊ'],  // boat, goat
        [/oe/g, 'oʊ'],  // toe
        [/ou/g, 'aʊ'],  // out, loud
        [/oi/g, 'ɔɪ'],  // oil, join
        [/oy/g, 'ɔɪ'],  // toy, joy
        [/ai/g, 'eɪ'],  // bait, main
        [/ay/g, 'eɪ'],  // day, say
        [/au/g, 'ɔ'],   // because, caught
        [/aw/g, 'ɔ'],   // saw, draw
        [/ey/g, 'eɪ'],  // they, prey
        [/ir/g, 'ɜr'],  // bird, sir
        [/ur/g, 'ɜr'],  // turn, burn
        [/er/g, 'ɜr'],  // her, fern
        [/ar/g, 'ɑr'],  // car, far
        [/or/g, 'ɔr'],  // for, door
        
        // Single vowels
        [/a(?=[^aeiou])/g, 'æ'],  // cat, bad
        [/e(?=[^aeiou])/g, 'ɛ'],  // bed, let
        [/i(?=[^aeiou])/g, 'ɪ'],  // bit, sit
        [/o(?=[^aeiou])/g, 'ɑ'],  // dog, hot
        [/u(?=[^aeiou])/g, 'ʌ'],  // but, run
        
        // At end of word
        [/e$/gm, ''],   // silent e at end
        [/y$/gm, 'iː'], // happy ends with "ee" sound
        
        // Consonants
        [/b/g, 'b'],
        [/d/g, 'd'],
        [/f/g, 'f'],
        [/g/g, 'g'],
        [/h/g, 'h'],
        [/k/g, 'k'],
        [/l/g, 'l'],
        [/m/g, 'm'],
        [/n/g, 'n'],
        [/p/g, 'p'],
        [/r/g, 'r'],
        [/s/g, 's'],
        [/t/g, 't'],
        [/v/g, 'v'],
        [/w/g, 'w'],
      ];
      
      phoneticsMap.forEach(([pattern, replacement]) => {
        result = result.replace(pattern, replacement);
      });
      
      // Clean up any remaining artifacts
      result = result.replace(/[^a-z\sθʃtʃŋkfrzjdʒiːoʊaʊɔɪeɪɜrɑrɔræɛɪɑʌbdfghlmnpstvw]/g, '');
      
      // Clean extra spaces
      result = result.replace(/\s+/g, ' ').trim();
      
      return result;
    }

    function initRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      
      if (!SpeechRecognition) {
        updateStatus('❌ Not supported - Use Google Chrome', 'error');
        startBtn.disabled = true;
        return false;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'en-US';
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        startBtn.disabled = true;
        stopBtn.disabled = false;
        updateStatus('🎤 Listening... Speak naturally', 'listening');
      };

      recognition.onend = () => {
        if (isRecording) {
          try {
            recognition.start();
          } catch (e) {
            setTimeout(() => {
              try {
                recognition.start();
              } catch (err) {
                console.log('Restart failed');
              }
            }, 500);
          }
        }
      };

      recognition.onerror = (event) => {
        if (event.error !== 'no-speech' && isRecording) {
          console.error('Speech error:', event.error);
        }
      };

      recognition.onresult = (event) => {
        let transcript = '';

        for (let i = event.resultIndex; i < event.results.length; i++) {
          if (event.results[i].isFinal) {
            transcript += event.results[i][0].transcript + ' ';
          }
        }

        if (transcript && i > lastResultIndex) {
          finalTranscript += transcript;
          lastResultIndex = event.resultIndex;
        }

        // Convert to phonetic and display
        const phoneticText = toPhonetic(finalTranscript);
        transcriptEl.value = phoneticText;
      };

      return true;
    }

    startBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(track => track.stop());
        
        isRecording = true;
        finalTranscript = '';
        lastResultIndex = -1;

        if (!recognition) {
          initRecognition();
        }
        
        try {
          recognition.start();
        } catch (e) {
          console.log('Recognition already running');
        }

      } catch (error) {
        updateStatus('❌ Microphone access denied', 'error');
        isRecording = false;
      }
    });

    stopBtn.addEventListener('click', () => {
      isRecording = false;
      
      if (recognition) {
        recognition.stop();
      }
      
      startBtn.disabled = false;
      stopBtn.disabled = true;
      updateStatus('⏹️ Stopped', 'idle');
    });

    copyBtn.addEventListener('click', async () => {
      const text = transcriptEl.value.trim();
      
      if (!text) {
        updateStatus('⚠️ Nothing to copy', 'idle');
        return;
      }
      
      try {
        await navigator.clipboard.writeText(text);
        updateStatus('✅ Copied', 'idle');
        setTimeout(() => {
          if (isRecording) {
            updateStatus('🎤 Listening... Speak naturally', 'listening');
          } else {
            updateStatus('Ready to transcribe', 'idle');
          }
        }, 1500);
      } catch (e) {
        updateStatus('❌ Copy failed', 'error');
      }
    });

    clearBtn.addEventListener('click', () => {
      if (confirm('Clear transcript?')) {
        finalTranscript = '';
        lastResultIndex = -1;
        transcriptEl.value = '';
        updateStatus('✅ Cleared', 'idle');
      }
    });

    function generateTimestamp() {
      return new Date().toISOString().replace(/[:.]/g, '-').slice(0, -5);
    }

    function downloadFile(content, filename, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      updateStatus('✅ Downloaded', 'idle');
      setTimeout(() => {
        if (isRecording) {
          updateStatus('🎤 Listening... Speak naturally', 'listening');
        } else {
          updateStatus('Ready to transcribe', 'idle');
        }
      }, 1500);
    }

    exportTxtBtn.addEventListener('click', () => {
      const text = transcriptEl.value;
      
      if (!text) {
        updateStatus('⚠️ Nothing to export', 'idle');
        return;
      }
      
      const content = `ECHO LIVE TRANSCRIBE - PHONETIC\nGenerated: ${new Date().toLocaleString()}\n\n${text}`;
      downloadFile(content, `transcript-phonetic-${generateTimestamp()}.txt`, 'text/plain');
    });

    exportJsonBtn.addEventListener('click', () => {
      const text = transcriptEl.value;
      
      if (!text) {
        updateStatus('⚠️ Nothing to export', 'idle');
        return;
      }
      
      const data = {
        generated: new Date().toISOString(),
        type: 'phonetic',
        transcript: text,
        wordCount: text.split(/\s+/).filter(w => w).length,
        characterCount: text.length
      };
      
      downloadFile(JSON.stringify(data, null, 2), `transcript-phonetic-${generateTimestamp()}.json`, 'application/json');
    });

    exportCsvBtn.addEventListener('click', () => {
      const text = transcriptEl.value;
      
      if (!text) {
        updateStatus('⚠️ Nothing to export', 'idle');
        return;
      }
      
      const words = text.split(/\s+/).filter(w => w);
      let csv = 'Word Number,Phonetic\n';
      words.forEach((word, index) => {
        csv += `${index + 1},"${word}"\n`;
      });
      
      downloadFile(csv, `transcript-phonetic-${generateTimestamp()}.csv`, 'text/csv');
    });

    updateStatus('Ready to transcribe phonetically', 'idle');
  </script>
</body>
</html>
